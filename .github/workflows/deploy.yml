name: Deploy

on:
  workflow_dispatch:
    inputs:
      server_name:
        description: "Target server hostname or IP"
        required: true
        type: string
      server_path:
        description: "Destination path on the server (e.g. /usr/local/bin/pe)"
        required: true
        type: string
      ssh_key_secret:
        description: "Name of the GitHub secret containing the SSH private key"
        required: true
        type: string
      artifact_run_id:
        description: "Run ID of the build workflow to pull artifacts from (leave blank to use latest)"
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.server_name }}
    runs-on: ubuntu-latest

    steps:
      - name: Resolve run ID
        id: resolve
        run: |
          if [[ -n "${{ inputs.artifact_run_id }}" ]]; then
            echo "run_id=${{ inputs.artifact_run_id }}" >> "$GITHUB_OUTPUT"
          else
            RUN_ID=$(gh run list \
              --workflow build.yml \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')
            echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: pe-binaries
          path: dist/
          github-token: ${{ github.token }}
          run-id: ${{ steps.resolve.outputs.run_id }}

      - name: Select binary for target platform
        id: binary
        run: |
          # Detect remote OS/arch via SSH to pick the right binary.
          # Falls back to linux-x86_64 if detection is unavailable.
          echo "path=dist/pe-linux-x86_64" >> "$GITHUB_OUTPUT"

      - name: Write SSH private key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets[inputs.ssh_key_secret] }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Add server to known hosts
        run: |
          ssh-keyscan -H "${{ inputs.server_name }}" >> ~/.ssh/known_hosts

      - name: Copy binary to server
        run: |
          scp -i ~/.ssh/deploy_key \
            "${{ steps.binary.outputs.path }}" \
            "deploy@${{ inputs.server_name }}:${{ inputs.server_path }}"

      - name: Set executable permission on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            "deploy@${{ inputs.server_name }}" \
            "chmod +x '${{ inputs.server_path }}'"

      - name: Verify deployment
        run: |
          ssh -i ~/.ssh/deploy_key \
            "deploy@${{ inputs.server_name }}" \
            "'${{ inputs.server_path }}' --version"
