name: Build

on:
  push:
    branches: ["**"]
  workflow_dispatch:
    inputs:
      run_e2e:
        description: "Run end-to-end integration tests"
        required: false
        default: "false"
        type: boolean

jobs:
  check:
    name: Test, Audit & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-check-

      - name: Run unit tests
        run: cargo test --locked

      - name: Security audit
        run: |
          cargo install cargo-audit --locked --quiet
          cargo audit

      - name: Code quality check (clippy)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Format check
        run: cargo fmt --check

  build:
    name: Build — ${{ matrix.artifact }}
    needs: check
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            artifact: pe-linux-x86_64
            binary: pe
            install: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends musl-tools

          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: pe-windows-x86_64.exe
            binary: pe.exe
            install: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: pe-macos-arm64
            binary: pe
            install: ""

          - target: x86_64-apple-darwin
            os: macos-13
            artifact: pe-macos-x86_64
            binary: pe
            install: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ matrix.target }}-cargo-

      - name: Install platform dependencies
        if: matrix.install != ''
        run: ${{ matrix.install }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: End-to-end integration tests
        if: ${{ inputs.run_e2e == 'true' }}
        run: cargo test --test '*' --features e2e -- --ignored

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: target/${{ matrix.target }}/release/${{ matrix.binary }}
          retention-days: 30

  package:
    name: Package all binaries
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten into single directory
        run: |
          for f in dist/*/*; do mv "$f" dist/; done
          find dist -type d -empty -delete

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: pe-binaries
          path: dist/
          retention-days: 30
